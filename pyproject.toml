[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "beautytpv"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3", "requests>=2.32", "lxml>=6", "qrcode[pil]>=8", "reportlab>=4", "cryptography>=44", "pyserial>=3.5", "pyusb>=1.3", "waitress>=3", "whitenoise>=6.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.10", "ruff>=0.11", "playwright>=1.50", "pytest-playwright>=0.7", "pypdf>=6"]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "schemas"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
